# Intent -> Agent -> Tier mapping.
#
# Source of truth for which agent owns an intent and what authentication
# tier it requires. See docs/design/authentication-flow.md SS4 for what each
# tier actually demands of the caller (SS7 for retry/lockout policy).
#
#   TIER_0: no authentication
#   TIER_1: possession leg (CLI match or OTP) + 1 knowledge factor
#   TIER_2: possession leg + MPIN/TPIN AND OTP (both)
#
# Only Tier 1 intents are defined so far -- extend this file as Tier 0/2
# agents and tools are added. Keep intent ids snake_case and stable once a
# tool is wired up to one; agents/tools should reference this id, not the
# display_name.

agents:
  accounts_agent:
    display_name: Accounts Agent
    intents:
      - id: balance_enquiry
        display_name: Balance Enquiry
        tier: TIER_1

  transaction_agent:
    display_name: Transaction Agent
    intents:
      - id: transaction_details
        display_name: Transaction Details
        tier: TIER_1
      - id: statement_request
        display_name: Statement Request
        tier: TIER_1

  service_agent:
    display_name: Service Agent
    intents:
      - id: change_of_address
        display_name: Change of Address
        tier: TIER_1
      - id: cheque_book_request
        display_name: Cheque Book Request
        tier: TIER_1
        note: >
          authentication-flow.md SS4 originally listed cheque book request
          as a TIER_2 example. Confirmed with stakeholders: TIER_1 is
          intentional here -- doesn't move money, but does issue a new
          payment instrument.
      - id: kyc_update
        display_name: KYC Update
        tier: TIER_1
        note: >
          Confirmed with stakeholders: this intent registers a service
          request for KYC re-verification, it does not modify KYC records
          over IVR -- TIER_1 is appropriate on that basis.
